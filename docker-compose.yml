services:
  prax:
    build: .
    image: prax-portal:latest
    container_name: prax-portal
    restart: unless-stopped
    # 不再直接把 3000 暴露到宿主机：改由 nginx 反代接管 80/443。
    # 若你想在服务器本机用 http://localhost:3000 调试，把下面两行注释打开即可。
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      # 数据库与上传文件都落在下面这个卷里，重建容器不丢数据
      PRAX_DATA_DIR: /app/data
      PRAX_DB_FILE: /app/data/prax.sqlite
      PRAX_UPLOAD_DIR: /app/data/uploads
      # 首次启动时用来自动创建管理员（仅在数据库为空时生效）
      PRAX_ADMIN_PASSWORD: "admin123"
    volumes:
      - prax-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - prax-net

  # NGINX 反向代理：把域名 80/443 转发到 prax:3000
  nginx:
    image: nginx:alpine
    container_name: prax-nginx
    restart: unless-stopped
    depends_on:
      - prax
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/prax.conf:/etc/nginx/conf.d/prax.conf:ro
      # HTTPS 证书挂载点（自备证书时取消注释）
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - prax-net

volumes:
  prax-data:

networks:
  prax-net:
    driver: bridge
