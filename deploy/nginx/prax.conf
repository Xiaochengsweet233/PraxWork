# ============================================================
#  Prax 门户 —— NGINX 反向代理配置
#
#  作用：把 80/443 端口的域名请求转发到 prax 容器的 3000 端口。
#  这是「Docker 部署后用域名访问提示拒绝连接」的修复关键：
#  prax 只监听容器内 3000 端口，域名默认走 80/443，中间缺一层反代。
#
#  用法：见 deploy/README.md 或根目录 docker-compose.nginx.yml
#  记得把 prax.yourdomain.com 换成你的真实域名。
# ============================================================

# 上传大小限制（视频/图片上传最大 200MB，这里放宽到 256M）
client_max_body_size 256m;

# 上游服务：容器网络内通过服务名 prax 访问
upstream prax_upstream {
    server prax:3000;
    keepalive 32;
}

# ---- HTTP 端口：先提供访问，再引导到 HTTPS（若启用 SSL） ----
server {
    listen 80;
    listen [::]:80;
    server_name prax.yourdomain.com;

    # 如果同一台机还跑着别的站点，这里按需保留；本配置只服务 prax 域名

    location / {
        proxy_pass http://prax_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 健康检查 / 静态资源直通（也可交给 Node 自身处理，这里统一反代）
    location /healthz {
        proxy_pass http://prax_upstream;
        proxy_set_header Host $host;
    }
}
